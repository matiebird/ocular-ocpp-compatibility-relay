name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh uninstall.sh
      - name: Parse YAML
        run: python -c 'import yaml; yaml.safe_load(open("config.yaml")); yaml.safe_load(open("ha-timing-script.yaml"))'
      - run: docker build --no-cache -t ocular-ocpp-compatibility-relay:test .
