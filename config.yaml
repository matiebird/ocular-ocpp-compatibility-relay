name: Ocular OCPP Compatibility Relay
version: "0.3.4"
slug: ocular_ocpp_compatibility_relay
description: Charger-compatible WebSocket relay for Ocular LTE Plus V3 OCPP dropouts
url: "https://github.com/matiebird/ocular-ocpp-compatibility-relay"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: false
privileged: []
full_access: false
ports:
  9000/tcp: 19000
ports_description:
  9000/tcp: "Charger-facing OCPP compatibility listener"
map: []
options:
  allowed_sources:
    - "192.168.1.50"
  expected_paths:
    - /central/central
  upstream_path: /central/central
  charge_point_id: central
  upstream_port: 9000
  max_message_bytes: 65536
  log_level: info
schema:
  allowed_sources:
    - str
  expected_paths:
    - str
  upstream_path: str
  charge_point_id: str
  upstream_port: port
  max_message_bytes: int
  log_level: list(debug|info|warning|error)
ingress: false
panel_icon: mdi:lan-connect
stage: experimental
